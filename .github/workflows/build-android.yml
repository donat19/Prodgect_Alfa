name: Build Offline MP3 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Build and capture log
        shell: bash
        run: |
          set +e
          {
            set -x
            java -version
            git clone https://github.com/donat19/Prodgect_Alfa.git bootstrap
            git clone https://github.com/ggml-org/whisper.cpp.git source
            git -C source checkout f133970bbb8c034ad9055a70afb97d61c24038f9
            cp -R bootstrap/overrides/. source/
            yes | sdkmanager --licenses
            sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1"
            cd source/examples/whisper.android
            ./gradlew --no-daemon assembleRelease
          } > build.log 2>&1
          result=$?
          cp build.log "$GITHUB_WORKSPACE/build.log" 2>/dev/null || true
          echo "$result" > "$GITHUB_WORKSPACE/exit-code.txt"
          exit 0
      - name: Upload diagnostics and APK
        uses: actions/upload-artifact@v4
        with:
          name: Offline-MP3-build-result
          path: |
            build.log
            exit-code.txt
            source/examples/whisper.android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
