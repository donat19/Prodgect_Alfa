name: Build Offline MP3 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1"
      - name: Prepare source
        run: |
          git clone https://github.com/ggml-org/whisper.cpp.git source
          git -C source checkout f133970bbb8c034ad9055a70afb97d61c24038f9
          cp -R overrides/. source/
      - name: Build APK
        working-directory: source/examples/whisper.android
        run: ./gradlew --no-daemon assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Offline-MP3-to-TXT-APK
          path: source/examples/whisper.android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
